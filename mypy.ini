[mypy]
plugins =
    mypy_django_plugin.main
# migrations are generated code; every other tool (black/isort/ruff/flake8)
# already skips them, so exclude them from type-checking too.
exclude = (^|/)migrations/

[mypy.plugins.django-stubs]
django_settings_module = "simple_locations.settings"

[mypy-mptt.*]
ignore_missing_imports = True


[mypy-modeltranslation.*]
ignore_missing_imports = True


[mypy-guardian.*]
ignore_missing_imports = True


[mypy-djgeojson.*]
ignore_missing_imports = True
